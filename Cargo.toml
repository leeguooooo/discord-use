[package]
name = "discord-use"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fast REST-only Discord MCP server + CLI (no gateway). Drop-in replacement for mcp-discord."
repository = "https://github.com/leeguooooo/discord-use"

[dependencies]
rmcp = { version = "0.11", features = ["server", "transport-io", "macros"] }
schemars = "1"
twilight-http = "0.17"
twilight-model = "0.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rustls = { version = "0.23", features = ["ring"], default-features = false }
# `upgrade` / daily update notice: GitHub releases API over the same hyper +
# rustls stack twilight-http already pulls in (no new crates in Cargo.lock).
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "rustls-platform-verifier"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
